<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Express Suncity Pro v5</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root { --p: #1d3557; --s: #25D366; --bg: #f1faee; --c: #ffffff; --d: #e63946; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px 15px 90px 15px; }
        .card { background: var(--c); padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, select, textarea, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        .row { display: flex; gap: 8px; }
        button { cursor: pointer; font-weight: bold; border: none; }
        .btn-p { background: var(--p); color: white; }
        .btn-d { background: var(--d); color: white; }
        .btn-s { background: var(--s); color: white; }
        .encomenda-item { border-left: 5px solid var(--p); padding: 10px; background: #fff; margin-bottom: 10px; border-radius: 5px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--p); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { color: #a5a5a5; font-size: 10px; text-align: center; text-decoration: none; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: white; }
        .tab-content { display: none; } .tab-content.active { display: block; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        canvas { border: 1px solid #000; background: #fff; width: 100%; height: 150px; touch-action: none; }
        .admin-only { display: none; }
        #areaCamera { display:none; width: 100%; height: 250px; background: #000; margin: 10px 0; }
    </style>
</head>
<body>
    <div id="login" class="card">
        <h2 style="text-align:center; color: var(--p);">📦 Express Suncity</h2>
        <input type="text" id="u" placeholder="Usuário">
        <input type="password" id="s" placeholder="Senha">
        <button class="btn-p" onclick="fLogin()">Entrar</button>
    </div>

    <div id="app" style="display:none;">
        <div style="display:flex; justify-content: space-between; margin-bottom: 10px;">
            <small>Olá, <b id="pNome"></b></small>
            <button onclick="fLogout()" style="width:auto; padding:2px 10px;" class="btn-d">SAIR</button>
        </div>

        <div id="tReceber" class="tab-content active">
            <h3>📥 Entrada</h3>
            <div class="row">
                <select id="bSel" onchange="uAptos('bSel','aSel')"><option value="">Bloco...</option></select>
                <select id="aSel"><option value="">Apto...</option></select>
            </div>
            <select id="desc"><option value="M. Livre">Mercado Livre</option><option value="Shopee">Shopee</option><option value="Doc">Envelopes</option><option value="Outros">Outros</option></select>
            <div class="row"><input type="text" id="rast" placeholder="Rastreio"><button onclick="aCam()" style="width:50px;">📷</button></div>
            <div id="areaCamera"></div>
            <button class="btn-p" onclick="rEnc()">Salvar</button>
        </div>

        <div id="tPend" class="tab-content">
            <h3>📋 Pendentes (<span id="cont">0</span>)</h3>
            <div class="row">
                <select id="fB" onchange="uAptosF('fB','fA'); fP()"><option value="">Todos Blocos</option></select>
                <select id="fA" onchange="fP()"><option value="">Aptos...</option></select>
            </div>
            <div id="lP" style="margin-top:10px;"></div>
        </div>

        <div id="tHist" class="tab-content">
            <h3>📦 Histórico</h3>
            <div id="lH"></div>
        </div>

        <div id="tRel" class="tab-content">
            <h3>📊 Relatórios</h3>
            <div class="row"><button onclick="window.print()">🖨️ PDF</button><button onclick="eRel()">✉️ E-mail</button></div>
            <div id="lR" style="margin-top:10px;"></div>
        </div>

        <div id="tConf" class="tab-content">
            <h3>⚙️ Config</h3>
            <div class="card">
                <h4>Moradores</h4>
                <select id="nB" onchange="uAptosC()"><option value="">Bloco...</option><option value="N">➕ Novo Bloco</option></select>
                <select id="nA" onchange="pMorador()"><option value="">Apto...</option></select>
                <input type="text" id="nN" placeholder="Nome">
                <input type="text" id="nT" placeholder="Tel">
                <button class="btn-p" onclick="sMorador()">Salvar</button>
            </div>
            <div class="card">
                <h4>Usuários</h4>
                <select id="uSel" onchange="pUser()"><option value="novo">➕ Novo Usuário</option></select>
                <input type="text" id="uL" placeholder="Login">
                <input type="text" id="uS" placeholder="Senha">
                <input type="text" id="uN" placeholder="Nome">
                <select id="uNi"><option value="Porteiro">Porteiro</option><option value="Admin">Admin</option></select>
                <button class="btn-p" onclick="sUser()">Salvar Usuário</button>
            </div>
        </div>

        <div class="nav">
            <button class="nav-item active" onclick="mAba('tReceber',this)">📥<span>Receber</span></button>
            <button class="nav-item" onclick="mAba('tPend',this)">📋<span>Pendentes</span></button>
            <button class="nav-item" onclick="mAba('tHist',this)">📦<span>Histórico</span></button>
            <button class="nav-item admin-only" onclick="mAba('tRel',this)">📊<span>Relat.</span></button>
            <button class="nav-item admin-only" onclick="mAba('tConf',this)">⚙️<span>Config</span></button>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content card">
            <h3>Assinatura</h3>
            <input type="text" id="retirante" placeholder="Quem retirou?">
            <canvas id="pad"></canvas>
            <div class="row"><button onclick="lPad()">Limpar</button><button onclick="fModal()" class="btn-d">Sair</button></div>
            <button class="btn-s" style="margin-top:10px;" onclick="cBaixa()">Confirmar</button>
        </div>
    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwT_2_fDshjOspcNaqus6hmjACwkSXN58LnqzXs3JvMQHEYorSZAaWe2HaECns8SKDdHg/exec"; 
    let mDB = [], tDB = [], pLogado = "", idB = null, cam = null;

    async function fLogin() {
        const user = document.getElementById("u").value, pass = document.getElementById("s").value;
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ acao: "login", login:user, senha:pass }) });
        const d = await res.json();
        if(d.status === "ok") {
            pLogado = d.nome;
            localStorage.setItem("sUser", d.nome); localStorage.setItem("sNivel", d.nivel);
            iApp();
        } else alert(d.erro);
    }

    function iApp() {
        document.getElementById("login").style.display="none"; document.getElementById("app").style.display="block";
        document.getElementById("pNome").innerText = pLogado;
        if(localStorage.getItem("sNivel").toLowerCase().includes("adm")) document.querySelectorAll('.admin-only').forEach(e=>e.style.display='flex');
        sync();
    }

    async function sync() {
        const rM = await fetch(API_URL + "?acao=getMoradores"); mDB = await rM.json();
        const rE = await fetch(API_URL); tDB = await rE.json();
        pDropdowns(); fP(); fH();
        const rU = await fetch(API_URL + "?acao=getUsuarios");
        const users = await rU.json();
        const s = document.getElementById("uSel"); s.innerHTML = '<option value="novo">➕ Novo Usuário</option>';
        users.forEach(u => s.add(new Option(u.nome, JSON.stringify(u))));
    }

    function pDropdowns() {
        const blocos = [...new Set(mDB.map(m => m.bloco))].sort();
        ['bSel', 'fB', 'nB'].forEach(id => {
            const s = document.getElementById(id);
            const opt = id==='nB' ? '<option value="">Bloco...</option><option value="N">➕ Novo</option>' : '<option value="">Bloco...</option>';
            s.innerHTML = opt;
            blocos.forEach(b => s.add(new Option(`Bloco ${b}`, b)));
        });
    }

    function uAptos(ib, ia) {
        const b = document.getElementById(ib).value, s = document.getElementById(ia);
        s.innerHTML = '<option value="">Apto...</option>';
        mDB.filter(m => m.bloco === b).forEach(m => s.add(new Option(`${m.apto} - ${m.nome}`, m.apto)));
    }

    function uAptosF(ib, ia) {
        const b = document.getElementById(ib).value, s = document.getElementById(ia);
        s.innerHTML = '<option value="">Todos Aptos</option>';
        mDB.filter(m => m.bloco === b).forEach(m => s.add(new Option(m.apto, m.apto)));
    }

    function uAptosC() {
        const b = document.getElementById("nB").value, s = document.getElementById("nA");
        if(b==='N') { const n = prompt("Novo Bloco:"); if(n) { const o = new Option(n,n); document.getElementById("nB").add(o,1); document.getElementById("nB").value=n; } }
        s.innerHTML = '<option value="">Apto...</option>';
        mDB.filter(m => m.bloco === b).forEach(m => s.add(new Option(m.apto, m.apto)));
        s.add(new Option("➕ Novo Apto", "novo_a"));
    }

    function fP() {
        const b = document.getElementById("fB").value, a = document.getElementById("fA").value;
        const list = document.getElementById("lP"); list.innerHTML = "";
        const p = tDB.filter(e => e.status === "Pendente" && (!b || e.bloco==b) && (!a || e.apto==a));
        document.getElementById("cont").innerText = p.length;
        p.forEach(e => {
            const d = document.createElement("div"); d.className="encomenda-item";
            d.innerHTML = `<b>Bl ${e.bloco} - Ap ${e.apto}</b> (${e.nome})<br><small>${e.descricao}</small><br>
            <button class="btn-s" onclick="wapp('${e.telefone}','${e.nome}','${e.descricao}')">Zap</button>
            <button class="btn-d" onclick="oModal('${e.id}')">ENTREGAR</button>`;
            list.appendChild(d);
        });
    }

    function fH() {
        const list = document.getElementById("lH"); list.innerHTML = "";
        tDB.filter(e => e.status !== "Pendente").reverse().forEach(e => {
            const d = document.createElement("div"); d.className="encomenda-item"; d.style.borderLeftColor="var(--s)";
            d.innerHTML = `<b>Bl ${e.bloco} - Ap ${e.apto}</b><br><small>${e.descricao} - Entregue a: ${e.quemRetirou}</small>`;
            list.appendChild(d);
        });
    }

    const cv = document.getElementById('pad'), cx = cv.getContext('2d'); let draw = false;
    cv.addEventListener('touchstart', (e)=>{ draw=true; cx.beginPath(); const t=e.touches[0]; cx.moveTo(t.clientX-cv.getBoundingClientRect().left, t.clientY-cv.getBoundingClientRect().top); e.preventDefault(); });
    cv.addEventListener('touchmove', (e)=>{ if(!draw)return; const t=e.touches[0]; cx.lineTo(t.clientX-cv.getBoundingClientRect().left, t.clientY-cv.getBoundingClientRect().top); cx.stroke(); e.preventDefault(); });
    cv.addEventListener('touchend', ()=>draw=false);

    function oModal(id) { idB = id; document.getElementById("modal").style.display="flex"; cv.width = cv.offsetWidth; }
    function fModal() { document.getElementById("modal").style.display="none"; }
    function lPad() { cx.clearRect(0,0,cv.width,cv.height); }

    async function cBaixa() {
        const q = document.getElementById("retirante").value; if(!q) return alert("Quem retirou?");
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ acao: "baixar", id: idB, dataHora: new Date().toLocaleString(), porteiroSaida: pLogado, quemRetirou: q, imagemBase64: cv.toDataURL() }) });
        fModal(); sync();
    }

    function aCam() {
        const a = document.getElementById("areaCamera"); a.style.display="block";
        if(!cam) cam = new Html5Qrcode("areaCamera");
        cam.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (t)=>{ document.getElementById("rast").value=t; cam.stop(); a.style.display="none"; });
    }

    function mAba(id, b) {
        document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
        b.classList.add('active');
    }
    
    function fLogout() { localStorage.clear(); location.reload(); }
    function wapp(t, n, d) { window.location.href=`https://wa.me/${t}?text=Ola ${n}, seu pacote (${d}) chegou!`; }
    window.onload = () => { if(localStorage.getItem("sUser")) { pLogado=localStorage.getItem("sUser"); iApp(); } };
</script>
</body>
</html>
